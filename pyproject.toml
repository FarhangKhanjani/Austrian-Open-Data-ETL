[project]
name = "austria-open-data-etl"
version = "0.1.0"
description = "Daily ETL pipeline: Austrian open data (GeoSphere weather, E-Control fuel prices) into a PostgreSQL warehouse."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes, I: import sorting, B: bugbear, UP: modern syntax,
# S: bandit security checks, N: naming.
select = ["E", "F", "I", "B", "UP", "S", "N"]

[tool.ruff.lint.per-file-ignores]
# assert is the normal way to write pytest tests.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs a running PostgreSQL (docker compose up -d)",
]
