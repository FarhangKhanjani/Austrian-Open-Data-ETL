name: daily-etl

on:
  schedule:
    # 11:30 UTC = 12:30 in Vienna in winter, 13:30 in summer. Always after 12:00, the
    # only time Austrian fuel stations may raise prices, so the snapshot is stable for
    # the rest of the day; yesterday's weather is published long before that.
    # GitHub may start scheduled runs late under load, sometimes by 15 to 60 minutes.
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily, or backfill for weather history"
        type: choice
        options: [daily, backfill]
        default: daily
      start:
        description: "Backfill start date (YYYY-MM-DD), backfill only"
        required: false
      end:
        description: "Backfill end date (YYYY-MM-DD), backfill only"
        required: false

# Never two loads at the same time; a second trigger waits instead of cancelling the
# first, so a run is never killed halfway.
concurrency:
  group: daily-etl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Check the database secret exists
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret DATABASE_URL is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      # The same image that CI builds and checks, so production runs exactly that.
      - name: Build image
        run: docker build --tag austria-etl:${{ github.sha }} .

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODE: ${{ inputs.mode || 'daily' }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          args=(--mode "$MODE")
          if [ "$MODE" = "backfill" ]; then args+=(--start "$START" --end "$END"); fi
          # The summary file is mounted into the container so the pipeline can write the
          # job summary; --user matches the runner's user so it may write to that file.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e DATABASE_URL \
            -e GITHUB_EVENT_NAME -e GITHUB_SHA \
            -e GITHUB_STEP_SUMMARY=/github/summary.md \
            -v "$GITHUB_STEP_SUMMARY:/github/summary.md" \
            austria-etl:${{ github.sha }} "${args[@]}"
