name: ci

on:
  push:
  pull_request:

# A newer push to the same branch cancels the older, still-running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Throwaway Postgres for the integration tests, same major version as
    # docker-compose.yml. It lives only as long as this job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: etl
          POSTGRES_PASSWORD: etl_ci_password
          POSTGRES_DB: austria_etl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etl -d austria_etl"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://etl:etl_ci_password@localhost:5432/austria_etl

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies (from uv.lock)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Apply schema and views
        run: uv run python -m pipeline.run --init-db

      - name: Run tests
        run: uv run pytest -ra
