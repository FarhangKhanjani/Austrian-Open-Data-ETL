# Local PostgreSQL for development and integration tests.
# Production uses a hosted Postgres (see docs, Milestone 6).
services:
  postgres:
    image: postgres:16-alpine
    container_name: austria-etl-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etl_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-austria_etl}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etl} -d ${POSTGRES_DB:-austria_etl}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
